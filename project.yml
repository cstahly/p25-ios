name: P25Monitor
options:
  bundleIdPrefix: com.sadbabyrabbit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:
  P25Monitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: P25Monitor
    # xcodegen rewrites this file from `properties` on every run, so Xcode
    # emptying it (which is how CarPlay kept vanishing) gets undone by release.sh.
    entitlements:
      path: P25Monitor/P25Monitor.entitlements
      properties:
        com.apple.developer.carplay-driving-task: true
    preBuildScripts:
      - name: Verify CarPlay entitlement
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/P25Monitor/P25Monitor.entitlements
        script: |
          if ! /usr/libexec/PlistBuddy -c "Print :com.apple.developer.carplay-driving-task" \
               "$SRCROOT/P25Monitor/P25Monitor.entitlements" 2>/dev/null | grep -q true; then
            echo "error: P25Monitor.entitlements lost the CarPlay key (Xcode stripped it). Run xcodegen, or git checkout the file."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadbabyrabbit.P25Monitor
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "634QAM3ZHG" # so xcodegen doesn't wipe signing each regen
        INFOPLIST_FILE: P25Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: P25Monitor/P25Monitor.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: P25Monitor/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"   # marketing version — bump for real releases
        CFBundleVersion: "202611111735"                 # build number — release.sh overwrites with a timestamp
        # App uses only standard HTTPS/TLS (exempt encryption) -> declare it so every
        # TestFlight build skips the "Missing Compliance" hold and goes straight to testers.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Shows your position on the incident map"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: ""
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
